<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="aguacion_app">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>aguacion_app</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <!-- MapLibre GL JS -->
  <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
  <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
  
  <!-- PMTiles JS -->
  <script src="https://unpkg.com/pmtiles@2.11.0/dist/index.js"></script>
  
  <script>
    // Register PMTiles protocol immediately since we now load MapLibre explicitly above
    window.addEventListener('load', function() {
      if (window.maplibregl && window.pmtiles) {
        const protocol = new pmtiles.Protocol();
        window.maplibregl.addProtocol("pmtiles", protocol.tile);
      }
    });

    // PWA Install Prompt handler
    window.deferredPwaPrompt = null;
    window.addEventListener('beforeinstallprompt', function(e) {
      e.preventDefault();
      window.deferredPwaPrompt = e;
      window.dispatchEvent(new CustomEvent('pwa_prompt_ready'));
    });
    window.promptPwaInstall = async function() {
      if (window.deferredPwaPrompt) {
        window.deferredPwaPrompt.prompt();
        const choice = await window.deferredPwaPrompt.userChoice;
        window.deferredPwaPrompt = null;
        return choice.outcome;
      }
      return 'not_supported';
    };
    window.isPwaStandalone = function() {
      return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
    };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
