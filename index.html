<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/app-movil-sismo-v2/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Puntos oficiales de abastecimiento de agua potable y rutas peatonales ante sismos y emergencias - SUNASS">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="AguaCION">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>AguaCION - Puntos de Agua en Emergencia | SUNASS</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <!-- Local MapLibre GL JS & CSS (Offline, no CDN dependency) -->
  <link href="maplibre-gl.css" rel="stylesheet" />
  <script src="maplibre-gl.js"></script>
  
  <!-- Local PMTiles JS (Offline) -->
  <script src="pmtiles.js"></script>

  <!-- PMTiles Offline IndexedDB Adapter -->
  <script src="pmtiles_offline.js"></script>
  
  <script>
    // Register custom offline Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('sw.js').then(function(reg) {
          console.log('[Aguacion PWA] ServiceWorker registered with scope:', reg.scope);
        }).catch(function(err) {
          console.warn('[Aguacion PWA] ServiceWorker registration failed:', err);
        });
      });
    }

    // PWA Install Prompt handler
    window.deferredPwaPrompt = null;
    window.addEventListener('beforeinstallprompt', function(e) {
      e.preventDefault();
      window.deferredPwaPrompt = e;
      window.dispatchEvent(new CustomEvent('pwa_prompt_ready'));
    });
    window.promptPwaInstall = async function() {
      if (window.deferredPwaPrompt) {
        window.deferredPwaPrompt.prompt();
        const choice = await window.deferredPwaPrompt.userChoice;
        window.deferredPwaPrompt = null;
        return choice.outcome;
      }
      return 'not_supported';
    };
    window.isPwaStandalone = function() {
      return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
    };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
